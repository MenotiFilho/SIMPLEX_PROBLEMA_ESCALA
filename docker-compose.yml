services:
  postgres:
    image: postgres:16
    container_name: escalas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escalas_db
      POSTGRES_USER: escalas_user
      POSTGRES_PASSWORD: escalas_pass
    ports:
      - "5431:5432"
    volumes:
      - escalas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalas_user -d escalas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/escalaSimplex
      dockerfile: Dockerfile
    container_name: escalas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escalas_db
      SPRING_DATASOURCE_USERNAME: escalas_user
      SPRING_DATASOURCE_PASSWORD: escalas_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escalas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  escalas_postgres_data:
